name: Sync upstream

# 每天北京时间 05:00 自动同步上游 meatRoll/gemini-web2api，同步成功后重建 Docker 镜像。
# 注意：schedule 使用 UTC，21:00 UTC == 次日 05:00 Asia/Shanghai。
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "上游无新提交时也强制重建 Docker 镜像"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Merge upstream and rebuild image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # 配置 SYNC_TOKEN（带 repo + workflow 权限的 PAT）后，push 本身即可触发 Docker 工作流；
          # 未配置时退回 GITHUB_TOKEN，push 不会触发下游工作流，因此下面会显式 dispatch。
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/meatRoll/gemini-web2api.git
          git fetch --no-tags upstream main

      - name: Merge upstream main
        id: merge
        run: |
          set -eu
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "上游没有新提交，跳过合并"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "即将合入的上游提交："
          git log --oneline --no-decorate HEAD..upstream/main

          if git merge --no-edit upstream/main; then
            echo "合并成功（无冲突）"
          else
            echo "::warning::普通合并存在冲突，改用 -X theirs 以上游实现为准重试"
            git merge --abort || true
            if ! git merge --no-edit -X theirs upstream/main; then
              git merge --abort || true
              echo "::error::自动合并失败，需要人工处理冲突"
              exit 1
            fi
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "合并后版本：$(grep -m1 '__version__' gemini_web2api/__init__.py)"

      - name: Run regression tests
        if: steps.merge.outputs.changed == 'true'
        run: |
          python3 -m pip install --quiet -r requirements.txt pytest
          python3 -m pytest -q

      - name: Push merged main
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Trigger Docker build
        if: steps.merge.outputs.changed == 'true' || inputs.force_rebuild
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "已触发 docker.yml（latest 镜像重建）"
