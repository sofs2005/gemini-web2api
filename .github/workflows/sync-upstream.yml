name: Sync upstream

# 每天北京时间 05:00 自动同步上游 meatRoll/gemini-web2api，同步成功后重建 Docker 镜像。
# 注意：schedule 使用 UTC，21:00 UTC == 次日 05:00 Asia/Shanghai。
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "上游无新提交时也强制重建 Docker 镜像"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Merge upstream and rebuild image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # 配置 SYNC_TOKEN（带 repo + workflow 权限的 PAT）后，push 本身即可触发 Docker 工作流；
          # 未配置时退回 GITHUB_TOKEN，push 不会触发下游工作流，因此下面会显式 dispatch。
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/meatRoll/gemini-web2api.git
          git fetch --no-tags upstream main

      - name: Sync upstream main
        id: merge
        run: |
          set -eu
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "上游没有新提交，跳过同步"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "即将合入的上游提交："
          git log --oneline --no-decorate HEAD..upstream/main

          # 本地只有 .github/ 与少量上游修复（见 README 下方的 fork 说明），rebase 到上游保持线性历史
          if git rebase upstream/main; then
            echo "rebase 成功"
          else
            git rebase --abort || true
            echo "待合入的上游提交："
            git log --oneline --no-decorate HEAD..upstream/main | head -20
            echo "::error::rebase 冲突，已保留本地修复并中止同步，请人工处理"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "同步后版本：$(grep -m1 '__version__' gemini_web2api/__init__.py)"

      - name: Run regression tests
        if: steps.merge.outputs.changed == 'true'
        run: |
          python3 -m pip install --quiet -r requirements.txt pytest
          python3 -m pytest -q

      - name: Push synced main
        if: steps.merge.outputs.changed == 'true'
        run: git push --force-with-lease origin HEAD:main

      - name: Trigger Docker build
        if: steps.merge.outputs.changed == 'true' || inputs.force_rebuild
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "已触发 docker.yml（latest 镜像重建）"
